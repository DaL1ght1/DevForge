spring:
  application:
    name: DevForge

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL}/realms/DevForge
          jwk-set-uri: ${KEYCLOAK_INTERNAL_SERVER_URL}/realms/DevForge/protocol/openid-connect/certs

  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      client-id: ${SERVICE_NAME}-producer
      retries: 3
    consumer:
      group-id: ${SERVICE_NAME}-consumer
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      max-poll-records: 100
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.example.devforge.client.ProvisionerClient$ProvisionResponse
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "com.example.devforge.client,com.example.devforge.*"
    listener:
      ack-mode: BATCH
      concurrency: 3
      type: single
      observation-enabled: true

  threads:
    virtual:
      enabled: true


server:
  servlet:
    context-path: /api/v1


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  api-docs:
    path: /v3/api-docs


devforge:
  admin:
    username: ${DEVFORGE_ADMIN_USERNAME}
    email: ${DEVFORGE_ADMIN_EMAIL}
    password: ${DEVFORGE_ADMIN_PASSWORD}
    first-name: ${DEVFORGE_ADMIN_FIRST_NAME}
    last-name: ${DEVFORGE_ADMIN_LAST_NAME}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  kafka:
      topics:
        requestTopic: ${REQUEST_TOPIC}-requestTopic
        responseTopic: ${RESPONSE_TOPIC}-responseTopic
        partitions: 1
        replicas: 1
      group:
        id: ${GROUP_ID}-group

  keycloak:
    server-url: ${KEYCLOAK_INTERNAL_SERVER_URL}
    realm: DevForge
    adminClientId: devforge-admin
    adminClientSecret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

  templates:
    root: templates