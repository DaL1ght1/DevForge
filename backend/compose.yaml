services:
  postgres:
    image: 'postgres:18-alpine'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    env_file:
      - .env
    networks:
      - devForge

  keycloak-db:
    image: 'postgres:18-alpine'
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      org.springframework.boot.ignore: true
    env_file:
      - .env
    networks:
      - devForge

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    depends_on:
      - keycloak-db
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_SERVER_URL}
      KC_HTTP_PORT: 8180
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    env_file:
      - .env
    networks:
      - devForge

  kafka:
    image: 'apache/kafka:4.0.0'
    container_name: devforge-kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_CLUSTER_ID: '4L622n22Q6qSoaauxEvx4g'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - devForge

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DEVFORGE_TEMPLATES_ROOT: /app/templates
    depends_on:
      - postgres
      - keycloak
      - kafka
    extra_hosts:
      - 'localhost:host-gateway'
    ports:
      - '8080:8080'
    networks:
      - devForge

  provisioner:
    build:
      context: .
      dockerfile: provisioner/Dockerfile
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TEMPLATES_DIR: /app/templates
      WORKSPACE_DIR: /app/workspace
      PORT: 8081
    depends_on:
      - kafka
    ports:
      - '8081:8081'
    volumes:
      - provisioner-workspace:/app/workspace
    networks:
      - devForge

networks:
  devForge:
    driver: bridge

volumes:
  keycloak-db-data:
  pgdata:
  kafka-data:
  provisioner-workspace: