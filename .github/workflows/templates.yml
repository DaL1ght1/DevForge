name: Generated templates

on:
  push:
    branches: [main]
    paths:
      - "backend/provisioner/**"
      - "backend/templates/**"
      - ".github/workflows/templates.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/provisioner/**"
      - "backend/templates/**"
      - ".github/workflows/templates.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.list.outputs.templates }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: backend/provisioner/go.mod
          cache-dependency-path: backend/provisioner/go.sum
      - id: list
        shell: bash
        working-directory: backend/provisioner
        run: |
          set -euo pipefail
          # One matrix entry per template folder and per `ci` profile in its template.yaml,
          # so feature combinations (database, messaging, ...) are generated and built too.
          templates="$(go run ./cmd/template-gen -templates-root "$GITHUB_WORKSPACE/backend/templates" -list-ci)"
          test "$templates" != "[]"
          echo "templates=$templates" >> "$GITHUB_OUTPUT"

  templates:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: ${{ matrix.template }} (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.templates) }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: backend/provisioner/go.mod
          cache-dependency-path: backend/provisioner/go.sum

      - uses: actions/setup-java@v4.7.1
        if: contains(fromJSON('["MAVEN","GRADLE","GRADLE_KOTLIN_DSL"]'), matrix.buildTool)
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: contains(fromJSON('["GRADLE","GRADLE_KOTLIN_DSL"]'), matrix.buildTool)
        with:
          gradle-version: "8.10.2"

      - uses: actions/setup-node@v4.4.0
        if: contains(fromJSON('["NPM","PNPM"]'), matrix.buildTool)
        with:
          node-version: 22

      - name: Install pnpm
        if: matrix.buildTool == 'PNPM'
        run: npm install -g pnpm@9

      - uses: actions/setup-python@v5.6.0
        if: contains(fromJSON('["PIP","POETRY"]'), matrix.buildTool)
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.buildTool == 'CARGO'

      - uses: actions/setup-dotnet@v4
        if: matrix.buildTool == 'DOTNET_NUGET'
        with:
          dotnet-version: "8.0.x"

      - uses: shivammathur/setup-php@v2
        if: matrix.buildTool == 'COMPOSER'
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo
          tools: composer

      - name: Generate template
        id: generate
        shell: bash
        working-directory: backend/provisioner
        env:
          TEMPLATE: ${{ matrix.template }}
          PROFILE: ${{ matrix.profile }}
          FEATURES: ${{ join(matrix.features, ' ') }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/generated/$TEMPLATE-$PROFILE"
          mkdir -p "$output"
          feature_args=()
          for f in $FEATURES; do feature_args+=(-feature "$f"); done
          project="$(go run ./cmd/template-gen \
            -templates-root "$GITHUB_WORKSPACE/backend/templates" \
            -template "$TEMPLATE" \
            -service-name ci-service \
            "${feature_args[@]}" \
            -output "$output")"
          echo "Generated project: $project"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Build and test generated project
        working-directory: ${{ steps.generate.outputs.project }}
        shell: bash
        env:
          BUILD_TOOL: ${{ matrix.buildTool }}
        run: |
          set -euo pipefail
          case "$BUILD_TOOL" in
            MAVEN)
              mvn -B -q package ;;
            GRADLE|GRADLE_KOTLIN_DSL)
              gradle --no-daemon --console=plain build ;;
            GO_MODULES)
              go mod tidy
              go test ./...
              go build ./... ;;
            NPM)
              npm install --no-audit --no-fund
              npm test --if-present
              npm run build --if-present ;;
            PNPM)
              pnpm install --no-frozen-lockfile
              # With pnpm, options must come BEFORE the script name,
              # otherwise they are passed to the script itself
              pnpm run --if-present test
              pnpm run --if-present build ;;
            PIP)
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
              python -m pytest ;;
            POETRY)
              python -m pip install poetry
              poetry install --no-interaction --no-root
              poetry run pytest ;;
            CARGO)
              cargo test ;;
            COMPOSER)
              composer install --no-interaction --prefer-dist
              vendor/bin/phpunit tests ;;
            DOTNET_NUGET)
              dotnet test ;;
            *)
              echo "Unsupported buildTool: $BUILD_TOOL" >&2
              exit 1 ;;
          esac

      - name: Build generated Docker image
        working-directory: ${{ steps.generate.outputs.project }}
        run: docker build --tag "devforge-ci:${{ matrix.template }}-${{ matrix.profile }}" .
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: multi-service application
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: backend/provisioner/go.mod
          cache-dependency-path: backend/provisioner/go.sum

      - name: Generate application
        id: generate
        working-directory: backend/provisioner
        shell: bash
        run: |
          set -euo pipefail
          project="$(go run ./cmd/template-gen \
            -templates-root "$GITHUB_WORKSPACE/backend/templates" \
            -spec testdata/application.json \
            -output "$RUNNER_TEMP/application")"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Start every service
        working-directory: ${{ steps.generate.outputs.project }}
        run: docker compose up --build --detach

      - name: Every service answers through the shared infrastructure
        working-directory: ${{ steps.generate.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          for port in 8080 8081 8082 8083; do
            for attempt in $(seq 1 60); do
              curl -sf "http://localhost:$port/api/v1/ping" && break
              [ "$attempt" = 60 ] && { docker compose logs; exit 1; }
              sleep 5
            done
          done

      - name: Stop
        if: always()
        working-directory: ${{ steps.generate.outputs.project }}
        run: docker compose down --volumes
